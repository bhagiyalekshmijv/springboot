<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Student</title>
</head>
<body>
<h2>Update Student</h2>
<form action="#" th:action="@{/update/{id}(id=${studentDetails.id})}" method="post">
    <label>Name:</label>
    <input type="text" name="name" th:value="${studentDetails.name}" required /><br/><br/>
    <label>Class:</label>
    <input type="text" name="class" th:value="${studentDetails.studentClass}" required /><br/><br/>
    <label>Age:</label>
    <input type="text" name="age" th:value="${studentDetails.age}" required /><br/><br/>
    
    <button type="submit">Update</button>
</form>
</body>
</html>
