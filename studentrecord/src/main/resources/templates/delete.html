<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Delete Student</title>
</head>
<body>
<h2>Delete Student</h2>
<p>Are you sure you want to delete <span th:text="${studentDetails.name}"></span>?</p>
<form action="#" th:action="@{/delete/{id}(id=${studentDetails.id})}" method="post">
    <input type="hidden" name="name" th:value="${studentDetails.name}" />
    <button type="submit">Delete</button>
</form>
<a href="/all">Cancel</a>
</body>
</html>
